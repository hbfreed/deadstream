# serve_options runs only while serve_options-proxy (started by a visit to port 9090) needs it
[Unit]
StopWhenUnneeded=yes

[Service]
ExecStart=
ExecStart=/bin/bash -c "source /home/deadhead/timemachine/bin/activate && exec serve_options --debug 0 --host 127.0.0.1 --port 9091"
# the proxy starts once the page answers (Python takes a few seconds to load)
ExecStartPost=/bin/bash -c 'for i in $(seq 300); do (exec 3<>/dev/tcp/127.0.0.1/9091) 2>/dev/null && exit 0; sleep 0.2; done; exit 1'
