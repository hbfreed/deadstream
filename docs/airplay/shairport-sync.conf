// Time Machine: AirPlay into the system-wide PulseAudio, alongside the Time Machine player.
general = {
  name = "Time Machine";
  output_backend = "pa";
  dbus_service_bus = "system";
  mpris_service_bus = "system";
  interpolation = "basic";  // soxr (the default when available) takes most of a Pi 3 core
};
sessioncontrol = {
  allow_session_interruption = "yes";  // another phone can take over
  session_timeout = 20;
};
pa = {
  server = "unix:/var/run/pulse/native";
  application_name = "AirPlay";
};
metadata = {
  enabled = "yes";
  include_cover_art = "no";
  pipe_name = "/tmp/shairport-sync-metadata";
  pipe_timeout = 5000;
};
