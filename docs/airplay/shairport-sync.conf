// Time Machine: AirPlay 2 into the system-wide PulseAudio, alongside the Time Machine player.
// For Shairport Sync 5 built with AirPlay 2 (see docs/Fresh Install.md); Debian's 4.x package needs "pa" for "pulseaudio".
general = {
  name = "Time Machine";
  output_backend = "pulseaudio";
  dbus_service_bus = "system";
  mpris_service_bus = "system";
  interpolation = "vernier";  // made for low-power CPUs; soxr takes most of a Pi 3 core
  six_channel_mode = "off";  // stereo out: don't accept surround streams
  eight_channel_mode = "off";
};
sessioncontrol = {
  allow_session_interruption = "yes";  // classic AirPlay: another phone can take over (AirPlay 2 always can)
  session_timeout = 60;  // the minimum in version 5
};
pulseaudio = {
  server = "unix:/var/run/pulse/native";
  application_name = "AirPlay";
};
metadata = {
  enabled = "yes";
  include_cover_art = "no";
  pipe_name = "/tmp/shairport-sync-metadata";
  pipe_timeout = 5000;
};
